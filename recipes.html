<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library — Cholesterol-Friendly Meal Plan</title>
  <style>
    :root {
      --forest-900: #0f3527;
      --forest-800: #144130;
      --forest-700: #1b5a42;
      --forest-600: #236a4f;
      --surface: #f6f5f2;
      --card: #ffffff;
      --ink: #173126;
      --ink-soft: #4a5a52;
      --line: #dde6e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
    }
    .site-nav {
      background: var(--forest-900);
      display: flex;
      padding: 0 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      display: block;
      color: #b3cec2;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      letter-spacing: 0.04em;
    }
    .site-nav a:hover { color: #fff; }
    .site-nav a.active { color: #fff; border-bottom-color: #9fd4b7; }

    .hero {
      background: linear-gradient(160deg, var(--forest-900), var(--forest-700));
      color: #f3f7f4;
      padding: 26px 24px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }
    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      font-family: Georgia, serif;
      font-weight: 600;
    }
    .hero-sub { margin: 8px 0 0; color: #dbe8e0; font-size: 14px; }

    .hero-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-submit {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.12);
      color: #9fd4b7;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(159,212,183,0.35);
    }
    .btn-submit:hover { background: rgba(255,255,255,0.20); color: #fff; }

    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .section-heading {
      margin: 32px 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .section-heading:first-of-type { margin-top: 0; }

    .recipe-list {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .recipe-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .recipe-thumb {
      width: 54px;
      height: 54px;
      border-radius: 9px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e8efe9;
    }
    .recipe-name { font-size: 15px; color: var(--ink); flex: 1; }
    .recipe-name a { color: var(--forest-700); text-decoration: none; }
    .recipe-name a:hover { text-decoration: underline; }

    .tags { display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
    }
    .tag-breakfast { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
    .tag-lunch     { color: #065f46; border-color: #6ee7b7; background: #ecfdf5; }
    .tag-dinner    { color: #1b5a42; border-color: #86efac; background: #f0fdf4; }
    .tag-snack     { color: #4c1d95; border-color: #c4b5fd; background: #f5f3ff; }

    .external-link {
      font-size: 12px;
      color: #7a9a8a;
      text-decoration: none;
      margin-left: 4px;
    }
    .external-link:hover { color: var(--forest-600); text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Site navigation">
    <a href="index.html">📅 Meal Plan</a>
    <a href="recipes.html" class="active">📖 Recipe Library</a>
    <a href="tracker.html">📊 Daily Tracker</a>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">Cholesterol-Friendly</div>
    <h1>Recipe Library</h1>
    <p class="hero-sub">All approved recipes from the database, organized by meal type.</p>
    <div class="hero-actions">
      <a href="submit.html" class="btn-submit">+ Submit a recipe</a>
    </div>
  </div>

  <main id="main">Loading…</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    const MEAL_ORDER  = ["breakfast", "lunch", "dinner", "snack"];
    const MEAL_LABELS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" };

    function mealTypes(recipe) {
      const m = recipe.meal;
      return (Array.isArray(m) ? m : [m]).map(s => s.toLowerCase());
    }

    (async () => {
      setupNav();

      const { data: recipes, error } = await sb
        .from("recipes")
        .select("id, title, url, meal, image_url")
        .eq("status", "published")
        .order("title");

      const main = document.getElementById("main");

      if (error) {
        main.textContent = "Could not load recipes: " + error.message;
        return;
      }

      const groups = {};
      MEAL_ORDER.forEach(m => groups[m] = []);
      recipes.forEach(r => {
        const primary = mealTypes(r)[0];
        if (groups[primary]) groups[primary].push(r);
      });

      main.innerHTML = MEAL_ORDER.map(mealKey => {
        const list = groups[mealKey];
        if (!list.length) return "";

        const rows = list.map(r => {
          const allMeals    = mealTypes(r);
          const externalLink = r.url
            ? ` <a class="external-link" href="${r.url}" target="_blank" rel="noopener noreferrer">(recipe here ↗)</a>`
            : "";
          const nameHtml = `<a href="recipe.html?id=${r.id}">${r.title}</a>${externalLink}`;
          const tagsHtml = allMeals.map(m =>
            `<span class="tag tag-${m}">${MEAL_LABELS[m] || m}</span>`
          ).join("");
          const thumbHtml = r.image_url
            ? `<a href="recipe.html?id=${r.id}"><img class="recipe-thumb" src="${r.image_url}" alt="" loading="lazy"></a>`
            : `<span class="recipe-thumb"></span>`;

          return `
            <li class="recipe-row">
              ${thumbHtml}
              <span class="recipe-name">${nameHtml}</span>
              <span class="tags">${tagsHtml}</span>
            </li>`;
        }).join("");

        return `
          <p class="section-heading">${MEAL_LABELS[mealKey]}</p>
          <ul class="recipe-list">${rows}</ul>`;
      }).join("");
    })();
  </script>
</body>
</html>
