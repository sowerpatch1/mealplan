<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library — Cholesterol-Friendly Meal Plan</title>
  <style>
    :root {
      --forest-900: #0f3527;
      --forest-800: #144130;
      --forest-700: #1b5a42;
      --forest-600: #236a4f;
      --surface: #f6f5f2;
      --card: #ffffff;
      --ink: #173126;
      --ink-soft: #4a5a52;
      --line: #dde6e0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
    }

    .site-nav {
      background: var(--forest-900);
      display: flex;
      padding: 0 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      display: block;
      color: #b3cec2;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      letter-spacing: 0.04em;
    }
    .site-nav a:hover { color: #fff; }
    .site-nav a.active { color: #fff; border-bottom-color: #9fd4b7; }

    .hero {
      background: linear-gradient(160deg, var(--forest-900), var(--forest-700));
      color: #f3f7f4;
      padding: 26px 24px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }
    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      font-family: Georgia, serif;
      font-weight: 600;
    }
    .hero-sub { margin: 8px 0 0; color: #dbe8e0; font-size: 14px; }

    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .section-heading {
      margin: 32px 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .section-heading:first-of-type { margin-top: 0; }

    .recipe-list {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      border-top: 1px solid var(--line);
    }

    .recipe-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .recipe-name {
      font-size: 15px;
      color: var(--ink);
      flex: 1;
    }
    .recipe-name a {
      color: var(--forest-700);
      text-decoration: none;
    }
    .recipe-name a:hover { text-decoration: underline; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
    }
    .tag-breakfast { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
    .tag-lunch     { color: #065f46; border-color: #6ee7b7; background: #ecfdf5; }
    .tag-dinner    { color: #1b5a42; border-color: #86efac; background: #f0fdf4; }
    .tag-snack     { color: #4c1d95; border-color: #c4b5fd; background: #f5f3ff; }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Site navigation">
    <a href="index.html">📅 Meal Plan</a>
    <a href="recipes.html" class="active">📖 Recipe Library</a>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">Cholesterol-Friendly</div>
    <h1>Recipe Library</h1>
    <p class="hero-sub">All approved recipes from the database, organized by meal type.</p>
  </div>

  <main id="main">Loading…</main>

  <script>
    const MEAL_ORDER = ["breakfast", "lunch", "dinner", "snack"];
    const MEAL_LABELS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" };

    function mealTypes(recipe) {
      const m = recipe.meal;
      return (Array.isArray(m) ? m : [m]).map(s => s.toLowerCase());
    }

    fetch("recipe-database.json")
      .then(r => r.json())
      .then(data => {
        const recipes = data.recipes;

        // Group by primary meal type (first in list), sort alpha within each group
        const groups = {};
        MEAL_ORDER.forEach(m => groups[m] = []);

        recipes.forEach(r => {
          const primary = mealTypes(r)[0];
          if (groups[primary]) groups[primary].push(r);
        });
        MEAL_ORDER.forEach(m => groups[m].sort((a, b) => a.title.localeCompare(b.title)));

        const main = document.getElementById("main");
        main.innerHTML = MEAL_ORDER.map(mealKey => {
          const list = groups[mealKey];
          if (!list.length) return "";

          const rows = list.map(r => {
            const allMeals = mealTypes(r);
            const nameHtml = r.url
              ? `<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.title} ↗</a>`
              : r.title;
            const tagsHtml = allMeals.map(m =>
              `<span class="tag tag-${m}">${MEAL_LABELS[m] || m}</span>`
            ).join("");

            return `
              <li class="recipe-row">
                <span class="recipe-name">${nameHtml}</span>
                <span class="tags">${tagsHtml}</span>
              </li>`;
          }).join("");

          return `
            <p class="section-heading">${MEAL_LABELS[mealKey]}</p>
            <ul class="recipe-list">${rows}</ul>`;
        }).join("");
      })
      .catch(err => {
        document.getElementById("main").textContent = "Could not load recipes: " + err.message;
      });
  </script>
</body>
</html>
