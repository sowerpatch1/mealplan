<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Cholesterol-Friendly Meal Plan</title>
  <style>
    :root {
      --forest-900: #0f3527;
      --forest-700: #1b5a42;
      --forest-600: #236a4f;
      --sage-100:   #edf4ef;
      --surface:    #f6f5f2;
      --card:       #ffffff;
      --ink:        #173126;
      --ink-soft:   #4a5a52;
      --line:       #dde6e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
    }
    .site-nav {
      background: var(--forest-900);
      display: flex;
      padding: 0 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      display: block;
      color: #b3cec2;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      letter-spacing: 0.04em;
    }
    .site-nav a:hover { color: #fff; }

    .hero {
      background: linear-gradient(160deg, var(--forest-900), var(--forest-700));
      color: #f3f7f4;
      padding: 26px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }
    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      font-family: Georgia, serif;
      font-weight: 600;
    }
    .hero-sub { margin: 8px 0 0; color: #dbe8e0; font-size: 14px; }

    main {
      max-width: 400px;
      margin: 48px auto;
      padding: 0 20px 60px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
    }

    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }
    input:focus {
      border-color: var(--forest-600);
      box-shadow: 0 0 0 2px rgba(35,106,79,0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--forest-700);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--forest-900); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff5f5;
      border: 1px solid #f5c0bf;
      border-radius: 8px;
      color: #8b1c1c;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Site navigation">
    <a href="index.html">📅 Meal Plan</a>
    <a href="recipes.html">📖 Recipe Library</a>
    <a href="tracker.html">📊 Daily Tracker</a>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">Cholesterol-Friendly</div>
    <h1>Sign In</h1>
    <p class="hero-sub">Sign in to access the daily tracker and submit recipes.</p>
  </div>

  <main>
    <div class="login-card" id="loginCard">
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
      <p style="text-align:center;margin:16px 0 0;font-size:13px;">
        <a href="#" id="forgotLink" style="color:var(--forest-700);text-decoration:none;font-weight:500;">Forgot password?</a>
      </p>
    </div>

    <div class="login-card" id="forgotCard" style="display:none;">
      <p style="font-size:14px;color:var(--ink-soft);margin:0 0 18px;">Enter your email and we'll send a reset link.</p>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-primary" id="forgotBtn">Send reset link</button>
        <div class="error-msg" id="forgotMsg"></div>
      </form>
      <p style="text-align:center;margin:16px 0 0;font-size:13px;">
        <a href="#" id="backToLogin" style="color:var(--forest-700);text-decoration:none;font-weight:500;">← Back to sign in</a>
      </p>
    </div>

    <div class="login-card" id="resetCard" style="display:none;">
      <p style="font-size:14px;color:var(--ink-soft);margin:0 0 18px;">Choose a new password.</p>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required placeholder="••••••••">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="resetBtn">Update password</button>
        <div class="error-msg" id="resetMsg"></div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function redirectAfterLogin() {
      const params = new URLSearchParams(location.search);
      location.href = params.get("next") || "tracker.html";
    }

    // Detect recovery flow from URL hash (Supabase appends #access_token=...&type=recovery)
    _sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("forgotCard").style.display = "none";
        document.getElementById("resetCard").style.display = "";
      } else if (event === "SIGNED_IN" && !document.getElementById("resetCard").style.display !== "none") {
        // Normal sign-in (not mid-reset)
        if (document.getElementById("resetCard").style.display === "none") {
          redirectAfterLogin();
        }
      }
    });

    // Normal sign-in
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("submitBtn");
      const errEl    = document.getElementById("errorMsg");

      btn.disabled    = true;
      btn.textContent = "Signing in…";
      errEl.style.display = "none";

      const { error } = await _sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent    = error.message;
        errEl.style.display  = "";
        btn.disabled         = false;
        btn.textContent      = "Sign in";
      } else {
        redirectAfterLogin();
      }
    });

    // Forgot password toggle
    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("forgotCard").style.display = "";
    });
    document.getElementById("backToLogin").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("forgotCard").style.display = "none";
      document.getElementById("loginCard").style.display = "";
    });

    // Send reset email
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email  = document.getElementById("forgotEmail").value.trim();
      const btn    = document.getElementById("forgotBtn");
      const msgEl  = document.getElementById("forgotMsg");

      btn.disabled    = true;
      btn.textContent = "Sending…";
      msgEl.style.display = "none";

      const { error } = await _sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + location.pathname
      });

      if (error) {
        msgEl.textContent   = error.message;
        msgEl.style.display = "";
        msgEl.style.background = "#fff5f5";
        msgEl.style.borderColor = "#f5c0bf";
        msgEl.style.color = "#8b1c1c";
      } else {
        msgEl.textContent   = "Check your email for the reset link.";
        msgEl.style.display = "";
        msgEl.style.background = "#f0faf4";
        msgEl.style.borderColor = "#b3e6c9";
        msgEl.style.color = "#1b5a42";
      }
      btn.disabled    = false;
      btn.textContent = "Send reset link";
    });

    // Set new password
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw      = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const btn     = document.getElementById("resetBtn");
      const msgEl   = document.getElementById("resetMsg");

      msgEl.style.display = "none";

      if (pw.length < 6) {
        msgEl.textContent = "Password must be at least 6 characters.";
        msgEl.style.display = "";
        return;
      }
      if (pw !== confirm) {
        msgEl.textContent = "Passwords don't match.";
        msgEl.style.display = "";
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Updating…";

      const { error } = await _sb.auth.updateUser({ password: pw });

      if (error) {
        msgEl.textContent   = error.message;
        msgEl.style.display = "";
      } else {
        msgEl.textContent   = "Password updated! Redirecting…";
        msgEl.style.display = "";
        msgEl.style.background = "#f0faf4";
        msgEl.style.borderColor = "#b3e6c9";
        msgEl.style.color = "#1b5a42";
        setTimeout(redirectAfterLogin, 1500);
      }
      btn.disabled    = false;
      btn.textContent = "Update password";
    });
  </script>
</body>
</html>
